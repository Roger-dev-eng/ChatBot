spring.application.name=auth

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chatbot_auth}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
app.jwt.expiration=${JWT_EXPIRATION:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5000}
